# Base environment for the HMM Chord Tracker.
# Deliberately loose (no build strings / no bottom-of-tree transitive deps)
# so `conda env update -f environment.yml` resolves a fresh, consistent set.
#
# For reproducible builds, generate a separate locked file, e.g.:
#   conda env export --no-builds > environment.lock.yml
name: hmm-chordtracker

channels:
  - conda-forge
  - defaults

dependencies:
  # --- Interpreter + installer ---
  - python=3.12
  - pip

  # --- Numerical / data stack ---
  - numpy
  - pandas
  - scipy
  - scikit-learn

  # --- Audio + feature extraction ---
  - librosa
  - pysoundfile      # conda-forge name for the `soundfile` module (audio I/O)
  - audioread        # fallback decoder for formats libsndfile can't open

  # --- Plotting ---
  - matplotlib

  # --- Notebook / interactive work ---
  - jupyterlab
  - notebook
  - ipykernel
  - ipython
  - ipywidgets
  - requests