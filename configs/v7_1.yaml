# V7.1: the causal CRNN on input features that use no future audio (features_v7_1), retrained.
# Grid, bins, compression and the CRNN are V6's; the decoders and scores are V7's.
version: v7_1
base_config: v2.yaml      # compression (99th pct, gamma 10)

audio:
  sr: 22050
  mono: true
  harmonic_margin: 4.0
  harmonic_median_frames: 9   # past STFT frames in the causal harmonic median. Correction 1: 31 (V0-V7's
                              # width) held new notes back ~0.37 s; 9 (~0.1 s) is better with both seeds on
                              # validation (network alone 71.50 vs 70.42 %, offline frame Viterbi 74.60 vs 73.59 %)

cqt:                      # features_v7_1: V5's grid, computed causally into data/processed/v7_1_logcqt/
  hop_length: 2048
  fmin: F#0
  bins_per_octave: 24
  n_bins: 168
  tuning_seconds: 10.0    # A440 until 10 s of audio are in, then the tuning estimated on them (step 1:
                          # 77 % of training songs within 10 cents, below the 95 % rule; results/v7_1/tuning_train.json)

train:                    # train_v7_1.train, V6's settings, forward GRU
  seed: 0
  lr: 0.001
  max_epochs: 50
  patience: 5
  dropout: 0.5
  excerpt_frames: 128
  batch_excerpts: 8

transitions:              # V3 Billboard change prior, as V5 to V7
  counts: results/v3/billboard_counts.json
  alpha: 1
  tau: 1

decoder:                  # V7's grids
  p_self_grid: [0.1, 0.3, 0.5, 0.7, 0.8, 0.9, 0.95, 0.98]
  lags: [0, 1, 2, 4, 8, 16, 32]

# How far the input of a frame reaches past it: the harmonic part's STFT window (features_v7_1).
front_end_lookahead_frames: 1

frozen:                   # chosen on validation (two-seed mean of the mean of RWC-P and GuitarSet), for the single test run
  run: results/v7_1/median9_seed1     # the better seed on validation
  p_self:                             # best on-time WCSR per system (offline-frame-viterbi: aligned WCSR)
    forward-filter: 0.1
    offline-frame-viterbi: 0.98
    fixed-lag-viterbi: {0: 0.1, 1: 0.3, 2: 0.7, 4: 0.98, 8: 0.98, 16: 0.98, 32: 0.1}   # lag (frames): p_self
  # Best on-time WCSR: frame-argmax, lag 0. Smallest lag within 0.5 points of offline-frame-viterbi
  # (aligned WCSR): 8 frames (0.74 s).
