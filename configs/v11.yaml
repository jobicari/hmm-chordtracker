# V11: distil the V8 ensemble (vocabulary A, seeds 0 and 1, geometric mean) into one causal CRNN of V8's
# architecture. Data, features, vocabulary, decoders and points are V8's; with kl_weight 0 this is
# configs/v8.yaml's training. Judged on validation only (scripts/run_v10.py points).
version: v11
base_config: v2.yaml          # compression (99th pct, gamma 10)

data:
  choco_export: ~/github/choco_corpus_prep/export

audio:
  sr: 22050
  mono: true
  harmonic_margin: 4.0
  harmonic_median_frames: 9

cqt:
  hop_length: 2048
  fmin: F#1
  bins_per_octave: 24
  n_bins: 168
  tuning_seconds: 10.0

train:
  seed: 0
  lr: 0.001
  max_epochs: 50
  patience: 5
  dropout: 0.5
  excerpt_frames: 128
  batch_excerpts: 8
  input_lookahead: 2
  kl_weight: 1.0              # loss = CE(labels) + kl_weight * KL(teacher || student) on every frame in the song
  teachers: [results/v8/A_seed0, results/v8/A_seed1]
  pool_ratio: 2               # --pool: pool excerpts an epoch of stage A, as a multiple of the labelled excerpts

transitions:
  source: billboard
  counts: results/v3/billboard_counts.json
  alpha: 1
  tau: 1

decoder:
  p_self_grid: [0.1, 0.3, 0.5, 0.7, 0.8, 0.9, 0.95, 0.98]
  lags: [0, 1, 2, 4, 8, 16, 32]
  prior_power: 0.25

harmonic_lookahead_frames: 1

# Chosen on validation (results/v11/points_pool_kd1_seed1): the pool student, seed 1 (stage A on the
# unlabelled pool, then stage B on the labelled data), prior power 0.25, Billboard transition matrix;
# per point the p_self with the best mean sevenths of the three val sets. Total look-ahead as V8. Scored
# once on test by scripts/v8_test.py --freeze --config configs/v11.yaml --out results/v11/test.
frozen:
  points:
    - {name: network alone (0.28 s), vocab: A, seed: 1, run: results/v11/pool_kd1_seed1, system: frame-argmax, p_self: null, lag: 0}
    - {name: fixed-lag Viterbi (0.46 s), vocab: A, seed: 1, run: results/v11/pool_kd1_seed1, system: fixed-lag-viterbi, p_self: 0.3, lag: 2}
    - {name: fixed-lag Viterbi (0.65 s), vocab: A, seed: 1, run: results/v11/pool_kd1_seed1, system: fixed-lag-viterbi, p_self: 0.7, lag: 4}
    - {name: fixed-lag Viterbi (1.02 s), vocab: A, seed: 1, run: results/v11/pool_kd1_seed1, system: fixed-lag-viterbi, p_self: 0.98, lag: 8}
