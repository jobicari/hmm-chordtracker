# V8: richer chord vocabulary. V7.3's CRNN at c2_la2_seed0 (C2 grid, input look-ahead 2), trained on
# RWC-P + GuitarSet + the curated ChoCo export. Step 1 sets the data; the vocabulary comes in step 2.
version: v8
base_config: v2.yaml          # compression (99th pct, gamma 10)

data:
  choco_export: ~/github/choco_corpus_prep/export   # outside the repo, read in place; see data/choco/SOURCE.txt

audio:
  sr: 22050
  mono: true
  harmonic_margin: 4.0
  harmonic_median_frames: 9

cqt:
  hop_length: 2048
  fmin: F#1                   # the C2 grid: the network sees C2 to B7
  bins_per_octave: 24
  n_bins: 168
  tuning_seconds: 10.0        # RWC-P and GuitarSet (live-path estimate); ChoCo uses the manifest's tuning

train:                        # V7.2 at c2_la2_seed0
  seed: 0
  lr: 0.001
  max_epochs: 50
  patience: 5
  dropout: 0.5
  excerpt_frames: 128
  batch_excerpts: 8
  input_lookahead: 2

transitions:
  source: billboard          # billboard (counts below) or train (moves counted in the training targets)
  counts: results/v3/billboard_counts.json
  alpha: 1
  tau: 1

decoder:
  p_self_grid: [0.1, 0.3, 0.5, 0.7, 0.8, 0.9, 0.95, 0.98]
  lags: [0, 1, 2, 4, 8, 16, 32]
  prior_power: 0.25          # the decoders divide by prior ** prior_power (0 = the posterior as it is)

harmonic_lookahead_frames: 1

# Chosen on validation (results/v8/A_seed{0,1}/val_pp0.25): vocabulary A, prior power 0.25, Billboard
# transition matrix; per point the better seed and the p_self with the best mean sevenths. Total look-ahead
# = 3 frames (input look-ahead 2 + harmonic 1) + lag, at 2,048 / 22,050 s a frame. Scored once on test by
# scripts/v8_test.py --freeze.
frozen:
  points:
    - {name: network alone (0.28 s), vocab: A, seed: 1, system: frame-argmax, p_self: null, lag: 0}
    - {name: fixed-lag Viterbi (0.46 s), vocab: A, seed: 1, system: fixed-lag-viterbi, p_self: 0.5, lag: 2}
    - {name: fixed-lag Viterbi (0.65 s), vocab: A, seed: 1, system: fixed-lag-viterbi, p_self: 0.8, lag: 4}
    - {name: fixed-lag Viterbi (1.02 s), vocab: A, seed: 1, system: fixed-lag-viterbi, p_self: 0.98, lag: 8}
