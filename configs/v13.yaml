# V13: V11's recipe (configs/v11.yaml: V8's data, features, vocabulary A, decoders and points, distillation
# from the V8 ensemble) with two changes: the RWC-P and GuitarSet features rebuilt with the 12-bin tuning
# estimate (scripts/v13_cache.py), and an optional played-bass head trained from RWC-P's aligned MIDI
# (train.bass_weight; 0 = V11's stage B). Stage B starts from V11's stage A models (pool, already 12-bin).
# Judged on validation only.
version: v13
base_config: v2.yaml          # compression (99th pct, gamma 10)

data:
  choco_export: ~/github/choco_corpus_prep/export

audio:
  sr: 22050
  mono: true
  harmonic_margin: 4.0
  harmonic_median_frames: 9

cqt:
  hop_length: 2048
  fmin: F#1
  bins_per_octave: 24
  n_bins: 168
  tuning_seconds: 10.0

train:
  seed: 0
  lr: 0.001
  max_epochs: 50
  patience: 5
  dropout: 0.5
  excerpt_frames: 128
  batch_excerpts: 8
  input_lookahead: 2
  kl_weight: 1.0
  teachers: [results/v8/A_seed0, results/v8/A_seed1]
  bass_weight: 0.0            # loss += bass_weight * CE(played bass, 13 classes) on frames with a MIDI bass target

transitions:
  source: billboard
  counts: results/v3/billboard_counts.json
  alpha: 1
  tau: 1

decoder:
  p_self_grid: [0.1, 0.3, 0.5, 0.7, 0.8, 0.9, 0.95, 0.98]
  lags: [0, 1, 2, 4, 8, 16, 32]
  prior_power: 0.25

harmonic_lookahead_frames: 1
