[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hmm_chordtracker"
version = "0.1.0"
description = "An online HMM Chord Tracking system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "audioread>=3.1.0",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "ipywidgets>=8.1.9",
    "jams>=0.3.5",
    "jupyterlab>=4.6.4",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "mir-eval",
    "notebook>=7.6.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "soundfile>=0.13.1",
    "pyyaml",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not slow'"
markers = ["slow: needs the real GuitarSet in data/guitarset (run with: pytest -m slow)"]
filterwarnings = ["ignore:Passing a schema to Validator.iter_errors:DeprecationWarning:jsonschema.*"]

[tool.setuptools.package-data]
chordtracker = ["weights/*.pt"]   # the frozen V6 weights, for chordtracker.inference
